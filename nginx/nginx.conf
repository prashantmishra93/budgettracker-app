server {
    listen 80;
    server_name https://budgettracker-app-6wpg.onrender.com;

    # Serve React build files
    root /usr/share/nginx/html;
    index index.html;

    # Handle React routing (always fallback to index.html)
    location / {
        try_files $uri /index.html;
    }

    # Proxy all /api/ requests to Django backend
    location /api/ {
        proxy_pass https://budgettracker-api.onrender.com;  # your backend Render URL
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # (Optional) If Django serves static files separately
    location /static/ {
        alias /app/budgettracker-api/static/;
    }
}
