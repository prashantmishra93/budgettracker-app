services:
  - type: web
    name: pacific-budget-tracker-app
    env: static
    buildCommand: npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: REACT_APP_DEFAULTAUTH
        value: fake
      - key: REACT_APP_ENABLE_LOCAL_API
        value: 0
      - key: REACT_APP_API_URL
        value: http://localhost:8000
      - key: REACT_APP_APIKEY
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
